version: "2"
run:
  timeout: 10m
linters:
  enable:
    - errorlint
    - godot
    - gosec
    - misspell
    - revive
    - funcorder
    - modernize
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
